<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Kinesis</title>
  <meta name="description" content="Boxing gloves, tennis rackets, pickleball paddles and golf drivers with sensors built in, plus training essentials.">
  <meta name="theme-color" content="#0b1017">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
  <header id="site-header"></header>

  <main>
    <section class="shop-group first tone-a" data-group="instrumented">
      <div class="wrap">
        <div class="shop-group-head">
          <h2 class="h-md">Instrumented</h2>
          <span class="mono">Sensors inside · 04 products</span>
        </div>
        <div class="grid-4" id="grid-instrumented"></div>
      </div>
    </section>

    <section class="shop-group tone-b" data-group="essentials">
      <div class="wrap">
        <div class="shop-group-head">
          <h2 class="h-md">Essentials</h2>
          <span class="mono">Gear and accessories · 06 products</span>
        </div>
        <div class="grid-3" id="grid-essentials"></div>
      </div>
    </section>
  </main>

  <!-- Product sheet (opens over the page, like a streaming service's "more info") -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
      <button class="sheet-close" type="button" aria-label="Close" data-close>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
      <div id="sheet-content"></div>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
